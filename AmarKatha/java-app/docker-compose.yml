services:
  postgres:
    image: postgres:16-alpine
    container_name: amarkatha-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amarkatha}
      POSTGRES_USER: ${POSTGRES_USER:-amarkatha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amarkatha}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - amarkatha_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amarkatha} -d ${POSTGRES_DB:-amarkatha}"]
      interval: 3s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amarkatha-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-amarkatha}
      POSTGRES_USER: ${POSTGRES_USER:-amarkatha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amarkatha}
      # Placeholders allow boot without Google credentials; replace for real OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-docker-dev-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-docker-dev-placeholder}
      ADMIN_BOOTSTRAP_EMAILS: ${ADMIN_BOOTSTRAP_EMAILS:-}
      AMARKATHA_CONTACT_EMAIL: ${AMARKATHA_CONTACT_EMAIL:-hello@amarkatha.in}
      AMARKATHA_MEDIA_ROOT: /data/media
    volumes:
      # Shared with local runs (AMARKATHA_MEDIA_ROOT=./data/media) so uploads are visible either way
      - ./data/media:/data/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  amarkatha_pgdata:
