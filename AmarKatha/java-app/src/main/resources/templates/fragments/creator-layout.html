<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:fragment="styles">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --text: #111827;
            --muted: #6b7280;
            --bg: #fafafa;
            --card: #ffffff;
            --border: #e5e7eb;
            --error-bg: #fef2f2;
            --error-text: #b91c1c;
            --success-bg: #ecfdf5;
            --success-text: #047857;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        .logo {
            font-family: 'Literata', Georgia, serif;
            font-weight: 600;
            font-size: 1.25rem;
            color: var(--primary);
            text-decoration: none;
        }
        .nav-links { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }
        .nav-links button.signout {
            background: none; border: none; color: var(--muted);
            font: inherit; cursor: pointer; font-size: 0.9rem; font-weight: 500;
        }
        .nav-links button.signout:hover { color: var(--primary); }
        main.creator-main {
            max-width: 42rem;
            margin: 2rem auto 3rem;
            padding: 0 1.5rem;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            margin-bottom: 1rem;
        }
        h1 {
            font-family: 'Literata', Georgia, serif;
            font-size: 1.75rem;
            margin-bottom: 0.35rem;
        }
        .subtitle { color: var(--muted); line-height: 1.5; margin-bottom: 1.25rem; font-size: 0.95rem; }
        .meta { color: var(--muted); font-size: 0.875rem; margin-bottom: 1rem; }
        .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1rem; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0.65rem 1.25rem; border-radius: 0.5rem; font-weight: 600;
            font-size: 0.9rem; cursor: pointer; text-decoration: none; border: none;
            font-family: inherit;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-primary:disabled, .btn-primary.is-disabled {
            opacity: 0.5; pointer-events: none; cursor: not-allowed;
        }
        .btn-secondary {
            background: white; color: var(--text); border: 1px solid var(--border);
        }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        label {
            display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.35rem;
        }
        input[type="text"], select, textarea, input[type="file"] {
            width: 100%; padding: 0.65rem 0.75rem; border: 1px solid var(--border);
            border-radius: 0.5rem; font-size: 1rem; margin-bottom: 1rem; font-family: inherit;
        }
        textarea { min-height: 6rem; resize: vertical; }
        input:focus, select:focus, textarea:focus {
            outline: 2px solid rgba(79, 70, 229, 0.35); border-color: var(--primary);
        }
        .alert {
            padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.875rem;
            margin-bottom: 1rem; line-height: 1.5;
        }
        .alert-error { background: var(--error-bg); color: var(--error-text); }
        .alert-success { background: var(--success-bg); color: var(--success-text); }
        .alert-warn { background: #fff7ed; color: #9a3412; }
        .badge-warn { background: #fff7ed; color: #9a3412; }
        .series-item {
            display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start;
            padding: 1rem 0; border-bottom: 1px solid var(--border);
        }
        .series-item:last-child { border-bottom: none; padding-bottom: 0; }
        .series-item:first-child { padding-top: 0; }
        .series-item-main {
            display: flex; gap: 0.85rem; align-items: flex-start; min-width: 0; flex: 1;
        }
        .series-item-body { min-width: 0; flex: 1; }
        .series-thumb {
            flex-shrink: 0;
            width: 3.5rem; height: 4.5rem;
            border-radius: 0.4rem;
            border: 1px solid var(--border);
            object-fit: cover;
            background: #e5e7eb;
        }
        .series-item a.title {
            font-weight: 600; color: var(--text); text-decoration: none;
        }
        .series-item a.title:hover { color: var(--primary); }
        .share-path-row {
            display: flex; align-items: center; gap: 0.35rem; margin-top: 0.35rem;
            flex-wrap: wrap;
        }
        .share-path {
            font-size: 0.8rem; color: var(--muted); font-family: ui-monospace, monospace;
            word-break: break-all;
        }
        .btn-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 1.85rem; height: 1.85rem; padding: 0;
            border: 1px solid var(--border); border-radius: 0.4rem;
            background: white; color: var(--muted); cursor: pointer;
        }
        .btn-icon:hover { border-color: var(--primary); color: var(--primary); }
        .btn-icon.is-copied { border-color: var(--success-text); color: var(--success-text); }
        .cap-hint {
            margin: 0.2rem 0 0; font-size: 0.78rem; color: var(--muted); line-height: 1.35;
            max-width: 22rem;
        }
        .ongoing-cap { cursor: help; }
        .share-box-row {
            display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
        }
        .share-box-row a { word-break: break-all; }
        .badge {
            display: inline-block; font-size: 0.75rem; font-weight: 600;
            padding: 0.15rem 0.5rem; border-radius: 999px; background: #eef2ff; color: var(--primary);
        }
        .empty { color: var(--muted); font-size: 0.95rem; padding: 0.5rem 0; }
        .detail-row { margin: 0.5rem 0; font-size: 0.95rem; }
        .detail-row strong { display: inline-block; min-width: 6.5rem; color: var(--muted); font-weight: 500; }
        .hint { color: var(--muted); font-size: 0.875rem; margin-top: 1rem; }
        .share-box {
            margin-top: 1rem; padding: 0.75rem; background: var(--bg);
            border-radius: 0.5rem; font-size: 0.875rem; word-break: break-all;
        }
        .btn.is-busy, .btn:disabled.is-busy {
            opacity: 0.75; cursor: wait;
        }
        .form-progress {
            display: none; margin-top: 0.75rem; font-size: 0.875rem; color: var(--muted);
        }
        .form-progress.is-visible { display: block; }
        .form-progress-bar {
            height: 0.35rem; margin-top: 0.4rem; border-radius: 999px;
            background: #e0e7ff; overflow: hidden;
        }
        .form-progress-bar > span {
            display: block; height: 100%; width: 35%;
            background: var(--primary);
            animation: form-progress-slide 1.1s ease-in-out infinite;
        }
        @keyframes form-progress-slide {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(320%); }
        }
        .feedback-fab {
            position: fixed;
            left: calc(0.85rem + env(safe-area-inset-left, 0px));
            bottom: calc(0.85rem + env(safe-area-inset-bottom, 0px));
            z-index: 55;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.55rem 0.95rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            font-family: inherit;
            font-size: 0.8125rem;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 8px 28px rgba(17, 24, 39, 0.08);
        }
        .feedback-fab:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
    </style>
    </th:block>

    <script th:fragment="copyShare">
        document.querySelectorAll('.js-copy-share').forEach(function (el) {
            el.addEventListener('click', function () {
                var path = el.getAttribute('data-path');
                if (!path) return;
                var text = window.location.origin + path;
                navigator.clipboard.writeText(text).then(function () {
                    el.classList.add('is-copied');
                    var label = el.querySelector('.js-copy-label');
                    if (label) {
                        var prev = label.textContent;
                        label.textContent = 'Copied';
                        setTimeout(function () {
                            label.textContent = prev;
                            el.classList.remove('is-copied');
                        }, 1200);
                    } else {
                        var prevTitle = el.getAttribute('title') || 'Copy link';
                        el.setAttribute('title', 'Copied');
                        el.setAttribute('aria-label', 'Copied');
                        setTimeout(function () {
                            el.setAttribute('title', prevTitle);
                            el.setAttribute('aria-label', prevTitle);
                            el.classList.remove('is-copied');
                        }, 1200);
                    }
                });
            });
        });
    </script>
    <script th:fragment="busyForms">
        (function () {
            function markBusy(form, button) {
                if (form.dataset.busy === '1') {
                    return false;
                }
                form.dataset.busy = '1';
                form.querySelectorAll('button[type="submit"], input[type="submit"]').forEach(function (btn) {
                    btn.disabled = true;
                    btn.classList.add('is-busy', 'is-disabled');
                });
                if (button && button.dataset.busyLabel) {
                    button.dataset.idleLabel = button.textContent;
                    button.textContent = button.dataset.busyLabel;
                }
                var progress = form.querySelector('.form-progress');
                if (progress) {
                    progress.classList.add('is-visible');
                    var label = progress.querySelector('.form-progress-label');
                    if (label && button && button.dataset.busyLabel) {
                        label.textContent = button.dataset.busyLabel;
                    }
                }
                return true;
            }
            document.addEventListener('submit', function (event) {
                var form = event.target;
                if (!(form instanceof HTMLFormElement) || !form.classList.contains('js-busy-form')) {
                    return;
                }
                if (form.dataset.busy === '1') {
                    event.preventDefault();
                    return;
                }
                var submitter = event.submitter || form.querySelector('button[type="submit"]');
                if (!markBusy(form, submitter)) {
                    event.preventDefault();
                }
            }, true);
        })();
    </script>
</head>
<body>
<nav th:fragment="nav(active)" class="nav">
    <a href="/" class="logo">AmarKatha</a>
    <div class="nav-links">
        <a th:href="@{/creator}" th:classappend="${active == 'home'} ? ' active'">Home</a>
        <a th:href="@{/creator/series}" th:classappend="${active == 'series'} ? ' active'">My Series</a>
        <a th:href="@{/creator/profile}" th:classappend="${active == 'profile'} ? ' active'">Profile</a>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="signout">Sign out</button>
        </form>
    </div>
    <a class="feedback-fab"
       href="https://docs.google.com/forms/d/e/1FAIpQLSd2ZC6GS-92iA7TkiijEL_DkCnGaT3OYyr8sqMTkHa3Vm6b3Q/viewform"
       target="_blank" rel="noopener noreferrer"
       aria-label="Send feedback" title="Send feedback">Feedback</a>
</nav>
</body>
</html>
