<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' · AmarKatha'">AmarKatha</title>
    <th:block th:fragment="styles">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Tiro+Devanagari+Hindi&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/brand.css}">
    <style>
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            padding-top: calc(1rem + env(safe-area-inset-top, 0px));
            background: rgba(15, 13, 10, 0.94);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 40;
        }
        .nav-links { display: flex; gap: 1rem; flex-wrap: wrap; }
        .nav-links a {
            color: var(--mist);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .nav-links a:hover { color: var(--saffron); }
        main {
            max-width: 28rem;
            margin: 3rem auto;
            padding: 0 1.5rem 3rem;
        }
        .card {
            padding: 2rem;
            box-shadow: 3px 3px 0 0 var(--saffron);
        }
        h1 {
            font-size: 1.75rem;
            margin: 0 0 0.5rem;
        }
        .subtitle {
            line-height: 1.5;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .btn { width: 100%; }
        .btn-google { margin-top: 0.25rem; }
        .footer-link {
            display: block;
            text-align: center;
            margin-top: 1.25rem;
            color: var(--mist);
            font-size: 0.875rem;
        }
        .footer-link a { color: var(--saffron); }
        .signin-options {
            display: grid;
            gap: 0.75rem;
            margin-top: 0.25rem;
        }
        .signin-option-hint {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--saffron);
            margin-bottom: 0.35rem;
        }
    </style>
    </th:block>
</head>
<body th:fragment="body">
</body>
</html>
