<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin layout fragments</title>
</head>
<body>
<th:block th:fragment="styles">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Tiro+Devanagari+Hindi&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/brand.css}">
    <style>
        .admin-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.875rem 1.5rem;
            padding-top: calc(0.875rem + env(safe-area-inset-top, 0px));
            background: rgba(15, 13, 10, 0.94);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 40;
        }
        .admin-nav .logo {
            font-size: 1.15rem;
        }
        .admin-nav-links {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .admin-nav-links a {
            color: var(--mist);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .admin-nav-links a:hover,
        .admin-nav-links a.active { color: var(--saffron); }
        .admin-email {
            color: var(--mist);
            font-size: 0.8rem;
        }
        .btn-signout {
            background: none;
            border: none;
            color: var(--mist);
            font: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-signout:hover { color: var(--saffron); }
        .admin-main {
            max-width: 56rem;
            margin: 0 auto;
            padding: 1.75rem 1.25rem 3rem;
        }
        h1 {
            font-size: clamp(1.5rem, 4vw, 1.85rem);
            margin-bottom: 0.35rem;
        }
        .subtitle {
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .card {
            padding: 1.25rem 1.35rem;
            margin-bottom: 1.25rem;
        }
        .card h2 {
            font-family: var(--font-sans);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--saffron);
            margin-bottom: 0.85rem;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .btn { width: auto; }
        .btn-ghost {
            background: transparent;
            color: var(--saffron);
            border: none;
            padding: 0.25rem 0.4rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            min-height: auto;
        }
        .btn-soon {
            background: var(--ash);
            color: var(--mist);
            border: 1px dashed var(--border);
            cursor: default;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.85rem;
            margin-bottom: 1.25rem;
        }
        .stat {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem 1.1rem;
        }
        .stat .label {
            font-size: 0.75rem;
            color: var(--mist);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .stat .value {
            font-size: 1.75rem;
            font-weight: 700;
            margin-top: 0.25rem;
            font-family: var(--font-serif);
            color: var(--paper);
        }
        .stat .hint {
            font-size: 0.75rem;
            color: var(--mist);
            margin-top: 0.2rem;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        th, td {
            text-align: left;
            padding: 0.55rem 0.4rem;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
            color: var(--text-secondary);
        }
        th {
            color: var(--mist);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        code { font-size: 0.78rem; word-break: break-all; color: var(--paper); }
        .status {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.15rem 0.45rem;
            border-radius: 999px;
        }
        .status-available { background: var(--success-bg); color: var(--success-text); }
        .status-used, .status-exhausted { background: var(--ash); color: var(--mist); }
        .status-expired { background: var(--warn-bg); color: var(--warn-text); }
        .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
        .filters a {
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            color: var(--mist);
            background: var(--ink);
            border: 1px solid var(--border);
        }
        .filters a.active,
        .filters a:hover {
            color: var(--saffron);
            border-color: var(--saffron);
            background: var(--primary-soft);
        }
        .muted { color: var(--mist); font-size: 0.875rem; }
        .see-all {
            display: inline-block;
            margin-top: 0.75rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--saffron);
            text-decoration: none;
        }
        .token-actions { display: flex; gap: 0.25rem; flex-wrap: wrap; margin-top: 0.25rem; }
        .empty { font-size: 0.9rem; padding: 0.5rem 0; }
    </style>
</th:block>

<nav th:fragment="nav" class="admin-nav">
    <a th:href="@{/admin}" class="logo">AmarKatha Admin</a>
    <div class="admin-nav-links">
        <a th:href="@{/admin}"
           th:classappend="${navActive == 'dashboard'} ? ' active'">Dashboard</a>
        <a th:href="@{/admin/invites}"
           th:classappend="${navActive == 'invites'} ? ' active'">Invites</a>
        <a th:href="@{/admin/media}"
           th:classappend="${navActive == 'media'} ? ' active'">Media</a>
        <a th:href="@{/admin/profile}"
           th:classappend="${navActive == 'profile'} ? ' active'">Profile</a>
        <span class="admin-email" th:text="${adminEmail}">admin@example.com</span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn-signout">Sign out</button>
        </form>
    </div>
</nav>
</body>
</html>
