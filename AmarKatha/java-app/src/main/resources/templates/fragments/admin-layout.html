<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin layout fragments</title>
</head>
<body>
<th:block th:fragment="styles">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-soft: #eef2ff;
            --text: #111827;
            --muted: #6b7280;
            --bg: #f3f4f6;
            --card: #ffffff;
            --border: #e5e7eb;
            --success-bg: #ecfdf5;
            --success-text: #047857;
            --warn-bg: #fffbeb;
            --warn-text: #b45309;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .admin-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.875rem 1.5rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        .admin-nav .logo {
            font-family: 'Literata', Georgia, serif;
            font-weight: 600;
            font-size: 1.15rem;
            color: var(--primary);
            text-decoration: none;
        }
        .admin-nav-links {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .admin-nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .admin-nav-links a:hover,
        .admin-nav-links a.active { color: var(--primary); }
        .admin-email {
            color: var(--muted);
            font-size: 0.8rem;
        }
        .btn-signout {
            background: none;
            border: none;
            color: var(--muted);
            font: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-signout:hover { color: var(--primary); }
        .admin-main {
            max-width: 56rem;
            margin: 0 auto;
            padding: 1.75rem 1.25rem 3rem;
        }
        h1 {
            font-family: 'Literata', Georgia, serif;
            font-size: 1.75rem;
            margin-bottom: 0.35rem;
        }
        .subtitle {
            color: var(--muted);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.25rem 1.35rem;
            margin-bottom: 1.25rem;
        }
        .card h2 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            margin-bottom: 0.85rem;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.65rem 1.1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary {
            background: white;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .btn-ghost {
            background: transparent;
            color: var(--primary);
            border: none;
            padding: 0.25rem 0.4rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-soon {
            background: #f9fafb;
            color: var(--muted);
            border: 1px dashed var(--border);
            cursor: default;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.85rem;
            margin-bottom: 1.25rem;
        }
        .stat {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1rem 1.1rem;
        }
        .stat .label {
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .stat .value {
            font-size: 1.75rem;
            font-weight: 700;
            margin-top: 0.25rem;
        }
        .stat .hint {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.2rem;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        th, td { text-align: left; padding: 0.55rem 0.4rem; border-bottom: 1px solid var(--border); vertical-align: top; }
        th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
        code { font-size: 0.78rem; word-break: break-all; }
        .status {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.15rem 0.45rem;
            border-radius: 999px;
        }
        .status-available { background: var(--success-bg); color: var(--success-text); }
        .status-used { background: #f3f4f6; color: var(--muted); }
        .status-expired { background: var(--warn-bg); color: var(--warn-text); }
        .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
        .filters a {
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            color: var(--muted);
            background: white;
            border: 1px solid var(--border);
        }
        .filters a.active, .filters a:hover {
            color: var(--primary);
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        .alert {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }
        .alert-success { background: var(--success-bg); color: var(--success-text); }
        .muted { color: var(--muted); font-size: 0.875rem; }
        .see-all { display: inline-block; margin-top: 0.75rem; font-size: 0.875rem; font-weight: 600; color: var(--primary); text-decoration: none; }
        .token-actions { display: flex; gap: 0.25rem; flex-wrap: wrap; margin-top: 0.25rem; }
        .empty { color: var(--muted); font-size: 0.9rem; padding: 0.5rem 0; }
    </style>
</th:block>

<nav th:fragment="nav" class="admin-nav">
    <a th:href="@{/admin}" class="logo">AmarKatha Admin</a>
    <div class="admin-nav-links">
        <a th:href="@{/admin}"
           th:classappend="${navActive == 'dashboard'} ? ' active'">Dashboard</a>
        <a th:href="@{/admin/invites}"
           th:classappend="${navActive == 'invites'} ? ' active'">Invites</a>
        <span class="admin-email" th:text="${adminEmail}">admin@example.com</span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn-signout">Sign out</button>
        </form>
    </div>
</nav>
</body>
</html>
