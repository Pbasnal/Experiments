<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="styles">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Tiro+Devanagari+Hindi&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/brand.css}">
    <style>
        .legal-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            padding-top: calc(1rem + env(safe-area-inset-top, 0px));
            border-bottom: 1px solid var(--border);
            background: rgba(15, 13, 10, 0.94);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 40;
        }
        .legal-nav nav { display: flex; flex-wrap: wrap; gap: 0.25rem 0; }
        .legal-nav a {
            color: var(--mist);
            text-decoration: none;
            margin-left: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .legal-nav a.active,
        .legal-nav a:hover { color: var(--saffron); }
        .legal-nav .logo { margin-left: 0; }
        .legal-main {
            max-width: 40rem;
            margin: 0 auto;
            padding: 2rem 1.25rem 4rem;
        }
        .legal-main h1 {
            font-size: clamp(1.75rem, 4vw, 2.15rem);
            margin: 0 0 0.35rem;
        }
        .legal-meta {
            color: var(--mist);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .legal-main h2 {
            font-size: 1.15rem;
            margin: 1.75rem 0 0.5rem;
            color: var(--paper);
        }
        .legal-main section p,
        .legal-main li {
            color: var(--text-secondary);
        }
        .legal-main a { color: var(--saffron); }
        .legal-footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--mist);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
        }
        .legal-footer a { color: var(--saffron); }
    </style>
    </th:block>
</head>
<body>
<header th:fragment="header(active)" class="legal-nav">
    <a href="/" class="logo">AmarKatha</a>
    <nav>
        <a href="/legal/terms" th:classappend="${active == 'terms'} ? ' active'">Terms</a>
        <a href="/legal/privacy" th:classappend="${active == 'privacy'} ? ' active'">Privacy</a>
        <a href="/legal/grievance" th:classappend="${active == 'grievance'} ? ' active'">Grievance</a>
    </nav>
</header>
<footer th:fragment="footer" class="legal-footer">
    <a href="/">← Back to AmarKatha</a>
</footer>
</body>
</html>
