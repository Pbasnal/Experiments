<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' · AmarKatha'">AmarKatha</title>
    <th:block th:replace="~{fragments/auth-layout :: styles}"></th:block>
    <style>
        main {
            max-width: 42rem;
            margin: 4rem auto;
            padding: 0 1.5rem 3rem;
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: var(--primary-soft);
            color: var(--saffron);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: clamp(1.75rem, 4vw, 2rem);
            margin-bottom: 0.75rem;
        }
        p {
            color: var(--mist);
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn { width: auto; }
    </style>
</head>
<body>
<nav class="nav">
    <a href="/" class="logo">AmarKatha</a>
    <div class="nav-links">
        <a href="/">Stories</a>
        <a href="/creator">Creator</a>
        <a href="/login">Sign in</a>
    </div>
</nav>
<main>
    <span class="badge">Coming soon</span>
    <h1 th:text="${title}">Title</h1>
    <p th:text="${description}">Description</p>
    <div class="actions">
        <a href="/" class="btn btn-primary">Browse stories</a>
        <a href="/creator" class="btn btn-secondary">Creator home</a>
    </div>
</main>
</body>
</html>
