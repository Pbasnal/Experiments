<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${series.title} + ' · AmarKatha'">Series · AmarKatha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Literata:opsz,wght@7..72,600&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/creator-layout :: styles}"></th:block>
</head>
<body>
<nav th:replace="~{fragments/creator-layout :: nav(active='series')}"></nav>
<main class="creator-main">
    <h1 th:text="${series.title}">Series</h1>
    <p class="subtitle">Series metadata and chapters.</p>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

    <div class="card">
        <p class="detail-row"><strong>Status</strong> <span class="badge" th:text="${series.status}">ONGOING</span></p>
        <p class="detail-row"><strong>Language</strong> <span th:text="${series.contentLanguage}">en</span></p>
        <p class="detail-row"><strong>Slug</strong> <span th:text="${series.slug}">slug</span></p>
        <p class="detail-row" th:if="${series.description != null}">
            <strong>Description</strong>
            <span th:text="${series.description}">…</span>
        </p>

        <div class="share-box">
            Reader link (preview):
            <a th:href="@{/read/s/{slug}(slug=${series.slug})}"
               th:text="@{/read/s/{slug}(slug=${series.slug})}">/read/s/…</a>
        </div>

        <div class="actions">
            <a class="btn btn-secondary" th:href="@{/creator/series/{id}/edit(id=${series.id})}">Edit series</a>
            <a class="btn btn-secondary" th:href="@{/creator/series}">All series</a>
            <a class="btn btn-secondary" th:href="@{/read/s/{slug}(slug=${series.slug})}">Open reader page</a>
        </div>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap;">
            <h2 style="font-size:1.1rem; margin:0;">Chapters</h2>
            <form th:action="@{/creator/series/{id}/chapters(id=${series.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-primary">New chapter</button>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(chapters)}" class="empty" style="margin-top:1rem;">
            No chapters yet. Create a draft and upload pages.
        </div>
        <div th:each="c : ${chapters}" class="series-item">
            <div>
                <a class="title"
                   th:href="@{/creator/series/{sid}/chapters/{cid}/edit(sid=${series.id},cid=${c.id})}"
                   th:text="${c.title}">Chapter</a>
                <div class="meta" style="margin-top:0.25rem;">
                    #<span th:text="${c.chapterNumber}">1</span>
                    · <span class="badge" th:text="${c.state}">DRAFT</span>
                    · <span th:text="${c.slug}">slug</span>
                </div>
            </div>
            <a class="btn btn-secondary"
               th:href="@{/creator/series/{sid}/chapters/{cid}/edit(sid=${series.id},cid=${c.id})}">
                <span th:text="${c.state.name() == 'DRAFT' ? 'Edit' : 'View'}">Edit</span>
            </a>
        </div>
    </div>
</main>
</body>
</html>
