<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile · AmarKatha Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Literata:opsz,wght@7..72,600&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/admin-layout :: styles}"></th:block>
</head>
<body>
<nav th:replace="~{fragments/admin-layout :: nav}"></nav>
<main class="admin-main">
    <h1>Profile</h1>
    <p class="subtitle">Your admin account.</p>

    <div class="card">
        <h2>Account</h2>
        <p><strong>Name:</strong> <span th:text="${displayName}">Admin</span></p>
        <p><strong>Email:</strong> <span th:text="${adminEmail}">admin@example.com</span></p>
        <p><strong>Role:</strong> <span th:text="${role}">ADMIN</span></p>
        <p class="muted" style="margin-top: 1rem;">More profile settings coming soon.</p>
        <div class="actions" style="margin-top: 1.25rem;">
            <a th:href="@{/admin}" class="btn btn-secondary">Back to dashboard</a>
            <a href="/" class="btn btn-secondary">Reader site</a>
        </div>
    </div>
</main>
</body>
</html>
