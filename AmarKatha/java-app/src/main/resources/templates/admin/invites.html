<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invite Tokens · AmarKatha Admin</title>
    <th:block th:replace="~{fragments/auth-layout :: styles}"></th:block>
    <style>
        main { max-width: 48rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; margin-top: 1rem; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--border); }
        code { font-size: 0.8rem; word-break: break-all; }
        .btn-inline { width: auto; margin-top: 1rem; }
    </style>
</head>
<body>
<nav class="nav">
    <a href="/admin" class="logo">AmarKatha Admin</a>
    <div class="nav-links">
        <a href="/admin/invites">Invites</a>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" style="background:none;border:none;color:var(--muted);font:inherit;cursor:pointer;font-size:0.9rem;font-weight:500;">Sign out</button>
        </form>
    </div>
</nav>
<main>
    <div class="card">
        <h1>Invite tokens</h1>
        <p class="subtitle">One-time codes for creator signup. Share the signup link after generating.</p>

        <div class="alert alert-success" th:if="${newToken}">
            New invite created.
            <br>Signup link: <a th:href="@{/creator/signup(invite=${newToken})}" th:text="@{/creator/signup(invite=${newToken})}">link</a>
            <br>Token: <code th:text="${newToken}">token</code>
        </div>

        <form th:action="@{/admin/invites}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-primary btn-inline">Generate invite</button>
        </form>

        <table th:if="${!#lists.isEmpty(invites)}">
            <thead>
            <tr>
                <th>Token</th>
                <th>Status</th>
                <th>Expires</th>
                <th>Created</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="invite : ${invites}">
                <td><code th:text="${invite.token}">token</code></td>
                <td th:text="${invite.usedAt != null ? 'Used' : 'Available'}">Available</td>
                <td th:text="${invite.expiresAt != null ? #temporals.format(invite.expiresAt.atZone(T(java.time.ZoneId).of('Asia/Kolkata')), 'dd MMM yyyy') : '—'}">—</td>
                <td th:text="${#temporals.format(invite.createdAt.atZone(T(java.time.ZoneId).of('Asia/Kolkata')), 'dd MMM yyyy HH:mm')}">—</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
