<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2622"/>
      <stop offset="55%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="inkWash" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="halftone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="rgba(250,250,249,0.08)"/>
    </pattern>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#page)"/>
  <rect width="1600" height="1000" fill="url(#inkWash)" opacity="0.85"/>
  <rect width="1600" height="1000" fill="url(#halftone)"/>

  <!-- comic page stack, right side -->
  <g transform="translate(720,90) rotate(-3)">
    <rect x="20" y="24" width="720" height="780" rx="6" fill="#44403c" opacity="0.45"/>
    <rect x="0" y="0" width="720" height="780" rx="6" fill="#f5f0e8"/>
    <rect x="0" y="0" width="720" height="780" rx="6" fill="url(#halftone)" opacity="0.5"/>

    <!-- panel grid -->
    <rect x="28" y="28" width="300" height="420" fill="#292524"/>
    <rect x="28" y="28" width="300" height="420" fill="url(#inkWash)" opacity="0.7"/>
    <path d="M48 120 C120 90, 180 160, 250 110" stroke="#fafaf9" stroke-width="3" opacity="0.35" filter="url(#soft)"/>
    <path d="M70 340 L280 280" stroke="#c2410c" stroke-width="4" opacity="0.55"/>
    <circle cx="210" cy="200" r="48" fill="none" stroke="#0f766e" stroke-width="6" opacity="0.55"/>

    <rect x="352" y="28" width="340" height="200" fill="#1c1917"/>
    <path d="M372 88 H672 M372 128 H620 M372 168 H650" stroke="#a8a29e" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
    <rect x="352" y="252" width="340" height="196" fill="#134e4a"/>
    <path d="M390 390 C470 300, 560 430, 650 320" stroke="#fafaf9" stroke-width="5" opacity="0.4"/>

    <rect x="28" y="472" width="664" height="280" fill="#44403c"/>
    <rect x="28" y="472" width="664" height="280" fill="#c2410c" opacity="0.25"/>
    <path d="M80 620 Q360 520 640 640" stroke="#fafaf9" stroke-width="4" opacity="0.3"/>
    <path d="M120 700 H580" stroke="#fafaf9" stroke-width="10" stroke-linecap="round" opacity="0.12"/>
    <text x="56" y="720" fill="#fafaf9" font-family="Georgia, serif" font-size="42" opacity="0.28"></text>
  </g>

  <!-- left accent panels -->
  <g transform="translate(80,180) rotate(4)" opacity="0.75">
    <rect width="280" height="360" rx="4" fill="#f5f0e8"/>
    <rect x="16" y="16" width="248" height="160" fill="#0f766e" opacity="0.7"/>
    <rect x="16" y="192" width="248" height="136" fill="#1c1917"/>
    <path d="M40 250 H240 M40 280 H200" stroke="#a8a29e" stroke-width="6" opacity="0.4"/>
  </g>
</svg>
