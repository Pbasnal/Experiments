spring:
  application:
    name: amarkatha
  thymeleaf:
    cache: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:amarkatha}
    username: ${POSTGRES_USER:amarkatha}
    password: ${POSTGRES_PASSWORD:amarkatha}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    timeout: 12h
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 200MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid, profile, email
        provider:
          google:
            issuer-uri: https://accounts.google.com

server:
  port: ${SERVER_PORT:8080}
  # Honor X-Forwarded-* from Nginx/Caddy so OAuth redirects and cookies see HTTPS.
  forward-headers-strategy: framework
  error:
    include-message: always
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

amarkatha:
  # Public origin for OG tags when set (e.g. https://amarkatha.example.com). No trailing slash.
  # Leave empty locally — AbsoluteUrlBuilder falls back to the request / forwarded headers.
  public-base-url: ${AMARKATHA_PUBLIC_BASE_URL:}
  contact-email: ${AMARKATHA_CONTACT_EMAIL:hello@amarkatha.in}
  grievance:
    officer-name: ${AMARKATHA_GRIEVANCE_OFFICER:Founder (interim)}
  admin:
    bootstrap-emails: ${ADMIN_BOOTSTRAP_EMAILS:}
  media:
    root: ${AMARKATHA_MEDIA_ROOT:./data/media}
    max-pages-per-chapter: 40
    max-page-bytes: 16777216
    reconcile-on-startup: ${AMARKATHA_MEDIA_RECONCILE_ON_STARTUP:true}
    reconcile-schedule-enabled: ${AMARKATHA_MEDIA_RECONCILE_SCHEDULE:true}
    reconcile-interval-ms: ${AMARKATHA_MEDIA_RECONCILE_INTERVAL_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
