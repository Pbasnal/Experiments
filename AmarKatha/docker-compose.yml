# AmarKatha — local development (single compose file)
# Usage: docker compose up -d   OR   ./setup.sh
# App: http://localhost:5000

services:
  postgres:
    image: postgres:15
    container_name: amarkatha_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amarkatha}
      POSTGRES_USER: ${POSTGRES_USER:-amarkatha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amarkatha_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amarkatha_user} -d ${POSTGRES_DB:-amarkatha}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amarkatha_network

  web:
    build: .
    container_name: amarkatha_web
    environment:
      FLASK_APP: run.py
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_DEBUG: ${FLASK_DEBUG:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-amarkatha_user}:${POSTGRES_PASSWORD:-amarkatha_password}@postgres:5432/${POSTGRES_DB:-amarkatha}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-env}
      UPLOAD_FOLDER: /app/app/static/uploads
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-16777216}
      OAUTH_INSECURE_TRANSPORT: ${OAUTH_INSECURE_TRANSPORT:-true}
    command: python run.py --host 0.0.0.0 --port 5000
    ports:
      - "${WEB_PORT:-5000}:5000"
    volumes:
      - .:/app
      - ./app/static/uploads:/app/app/static/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - amarkatha_network

  redis:
    image: redis:7-alpine
    container_name: amarkatha_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - amarkatha_network

volumes:
  postgres_data:
  redis_data:

networks:
  amarkatha_network:
    driver: bridge
